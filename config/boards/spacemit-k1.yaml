plat: spacemit

opensbi:
  # Upstream OpenSBI with the RISE OP-TEE (MPXY/RPMI) work; K1 support is in the generic platform.
  src: opensbi
  platform: generic
  defconfig: defconfig

optee:
  # optee_os core/arch/riscv/plat-spacemit; loaded by SPL from u-boot.itb, see k1-x-optee.dtsi
  platform: spacemit-k1

uboot:
  defconfig: k1_defconfig
  defconfig_fragments: k1_android.config

android:
  binaries_path: vendor/spacemit/k1/bootloader

secure:
  avb: true
